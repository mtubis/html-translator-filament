version: 2

updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # A library: widen constraints in composer.json only when a release falls outside them,
  # otherwise just refresh the development lock file.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      composer-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
